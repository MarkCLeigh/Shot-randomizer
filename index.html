<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weston Point Warriors Shot Randomiser</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #111111;
      --accent: #007aff;
      --accent-active: #34c759;
      --text: #ffffff;
      --subtext: #8e8e93;
      --gold: #fdd835;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .club-crest {
      width: 75px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0px 2px 6px rgba(255, 255, 255, 0.15));
    }
    h1 {
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      margin: 0;
      text-transform: uppercase;
      color: #ffffff;
      text-align: center;
      font-weight: 800;
    }
    .subtitle {
      font-size: 0.75rem;
      color: var(--gold);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: bold;
      margin-top: -4px;
    }
    /* Scoreboard */
    .scoreboard {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transform: translateZ(0);
    }
    .score-item {
      text-align: center;
    }
    .score-num {
      font-size: 1.3rem;
      font-weight: bold;
    }
    .score-label {
      font-size: 0.65rem;
      color: var(--subtext);
      text-transform: uppercase;
      font-weight: bold;
    }
    .reset-link {
      background: none;
      border: none;
      color: var(--subtext);
      font-size: 0.75rem;
      text-decoration: underline;
      cursor: pointer;
      padding: 0;
      width: auto;
      box-shadow: none;
    }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transform: translateZ(0);
      will-change: transform;
    }
    .metric {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .metric-icon {
      font-size: 22px;
      width: 30px;
      text-align: center;
    }
    .metric-label {
      font-size: 0.7rem;
      color: var(--subtext);
      font-weight: bold;
    }
    .metric-value {
      font-size: 1rem;
      font-weight: bold;
    }
    /* Goal Graphic */
    .goal-container {
      position: relative;
      width: 100%;
      height: 120px;
      border: 4px solid #fff;
      border-bottom: none;
      background: rgba(255, 255, 255, 0.05);
      margin-top: 10px;
      border-radius: 4px 4px 0 0;
      overflow: hidden;
    }
    .target-ball {
      position: absolute;
      font-size: 22px;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0px 0px 4px rgba(255, 255, 255, 0.8));
      transition: top 0.2s ease-out, left 0.2s ease-out;
      will-change: top, left;
    }
    ul {
      margin: 6px 0 0 0;
      padding-left: 20px;
      color: #d1d1d6;
      font-size: 0.85rem;
    }
    li {
      margin-bottom: 4px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    button {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
    }
    button.auto-btn {
      background-color: transparent;
      border: 2px solid var(--accent-active);
      color: var(--accent-active);
      box-shadow: none;
    }
    button.auto-btn.active {
      background-color: var(--accent-active);
      color: #fff;
      box-shadow: 0 4px 12px rgba(52, 199, 89, 0.3);
    }
    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <img src="IMG_2172.png" alt="Weston Point Crest" class="club-crest" />
      <h1>Weston Point Warriors</h1>
      <div class="subtitle">Shot Randomiser</div>
    </header>

    <!-- Scoreboard Tracker -->
    <div class="scoreboard">
      <div class="score-item">
        <div class="score-num" id="goals-cnt" style="color: #34c759;">0</div>
        <div class="score-label">Goals</div>
      </div>
      <div class="score-item">
        <div class="score-num" id="misses-cnt" style="color: #ff3b30;">0</div>
        <div class="score-label">Misses</div>
      </div>
      <div class="score-item">
        <div class="score-num" id="accuracy-cnt">0%</div>
        <div class="score-label">Accuracy</div>
      </div>
      <button class="reset-link" onclick="resetStats()">Reset</button>
    </div>

    <div class="card">
      <div class="metric">
        <div class="metric-icon">🦶</div>
        <div>
          <div class="metric-label">FOOT</div>
          <div class="metric-value" id="foot-val">--</div>
        </div>
      </div>

      <div class="metric">
        <div class="metric-icon">⚽</div>
        <div>
          <div class="metric-label">SHOT TYPE</div>
          <div class="metric-value" id="type-val">--</div>
        </div>
      </div>

      <div class="metric">
        <div class="metric-icon">🎯</div>
        <div>
          <div class="metric-label">TARGET LOCATION</div>
          <div class="metric-value" id="target-val">--</div>
        </div>
      </div>

      <div class="goal-container" id="goal">
        <div class="target-ball" id="target-ball" style="top: 50%; left: 50%; display: none;">⚽</div>
      </div>
    </div>

    <div class="card">
      <div class="metric-label" style="margin-bottom: 4px;">KEY COACHING POINTS</div>
      <ul id="points-list">
        <li>Tap "GOAL (NEXT SHOT)" to begin your session.</li>
      </ul>
    </div>

    <div class="btn-group">
      <button onclick="handleGoalMade()">GOAL (NEXT SHOT)</button>
      <button id="auto-btn" class="auto-btn" onclick="toggleAutoMode()">START 1-MIN TIMER</button>
    </div>
  </div>

  <script>
    const feet = ["Left Foot", "Right Foot"];
    
    const targets = [
      { name: "Top Left Corner", top: "15%", left: "10%" },
      { name: "Top Right Corner", top: "15%", left: "90%" },
      { name: "Bottom Left Corner", top: "85%", left: "10%" },
      { name: "Bottom Right Corner", top: "85%", left: "90%" },
      { name: "Center Goal", top: "50%", left: "50%" }
    ];

    const shotTypes = [
      {
        name: "Instep Drive",
        subtitle: "Laces Shot",
        points: ["Keep your ankle locked", "Strike using the top of the laces", "Follow through towards target", "Body over the ball"]
      },
      {
        name: "Placed Shot",
        subtitle: "Inside Foot",
        points: ["Open up your hips", "Strike with the inside arch", "Wrap foot around for side spin", "Focus on accuracy over power"]
      },
      {
        name: "Chip Shot",
        subtitle: "Lofted",
        points: ["Jab beneath the ball", "Lean slightly backward", "Shorten your follow-through"]
      },
      {
        name: "Trivela",
        subtitle: "Outside Foot",
        points: ["Approach target at an angle", "Strike with pinky-toe edge", "Slice across the ball for outward curve"]
      }
    ];

    let timerId = null;
    let isAutoMode = false;
    let hasActiveShot = false;
    let goals = 0;
    let misses = 0;

    function speakInstructions(foot, type, target) {
      window.speechSynthesis.cancel();
      const phrase = `${foot}. ${type}. Aim for ${target}.`;
      
      const utterance = new SpeechSynthesisUtterance(phrase);
      utterance.rate = 0.9;
      utterance.pitch = 1.0;
      utterance.lang = 'en-US';

      window.speechSynthesis.speak(utterance);
    }

    function updateScoreboard() {
      document.getElementById("goals-cnt").innerText = goals;
      document.getElementById("misses-cnt").innerText = misses;
      
      const total = goals + misses;
      const pct = total === 0 ? 0 : Math.round((goals / total) * 100);
      document.getElementById("accuracy-cnt").innerText = `${pct}%`;
    }

    function resetStats() {
      goals = 0;
      misses = 0;
      updateScoreboard();
    }

    function generateShot() {
      const selectedFoot = feet[Math.floor(Math.random() * feet.length)];
      const selectedTarget = targets[Math.floor(Math.random() * targets.length)];
      const selectedType = shotTypes[Math.floor(Math.random() * shotTypes.length)];

      document.getElementById("foot-val").innerText = selectedFoot;
      document.getElementById("target-val").innerText = selectedTarget.name;
      document.getElementById("type-val").innerText = `${selectedType.name} (${selectedType.subtitle})`;

      const ball = document.getElementById("target-ball");
      ball.style.display = "block";
      ball.style.top = selectedTarget.top;
      ball.style.left = selectedTarget.left;

      const list = document.getElementById("points-list");
      list.innerHTML = "";
      selectedType.points.forEach(point => {
        const li = document.createElement("li");
        li.innerText = point;
        list.appendChild(li);
      });

      speakInstructions(selectedFoot, selectedType.name, selectedTarget.name);
      hasActiveShot = true;
    }

    function handleTimerTimeout() {
      if (hasActiveShot) {
        misses++;
        updateScoreboard();
      }
      generateShot();
    }

    function resetInterval() {
      if (isAutoMode) {
        clearInterval(timerId);
        timerId = setInterval(handleTimerTimeout, 60000);
      }
    }

    function handleGoalMade() {
      if (hasActiveShot) {
        goals++;
        updateScoreboard();
      }
      generateShot();
      resetInterval();
    }

    function toggleAutoMode() {
      const btn = document.getElementById("auto-btn");
      isAutoMode = !isAutoMode;

      if (isAutoMode) {
        btn.innerText = "STOP AUTO TIMER";
        btn.classList.add("active");
        generateShot();
        timerId = setInterval(handleTimerTimeout, 60000);
      } else {
        btn.innerText = "START 1-MIN TIMER";
        btn.classList.remove("active");
        clearInterval(timerId);
        window.speechSynthesis.cancel();
      }
    }
  </script>
</body>
</html>
