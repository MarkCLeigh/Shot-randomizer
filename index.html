<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shot Randomizer</title>
  <style>
    :root {
      --bg: #091322;
      --card-bg: rgba(255, 255, 255, 0.07);
      --accent: #007aff;
      --accent-active: #34c759;
      --text: #ffffff;
      --subtext: #8e8e93;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    header {
      text-align: center;
      margin-bottom: 5px;
    }
    h1 {
      font-size: 1.2rem;
      letter-spacing: 1px;
      margin: 0;
      text-transform: uppercase;
      color: var(--subtext);
    }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .metric {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .metric-icon {
      font-size: 24px;
      width: 32px;
      text-align: center;
    }
    .metric-label {
      font-size: 0.7rem;
      color: var(--subtext);
      font-weight: bold;
    }
    .metric-value {
      font-size: 1.1rem;
      font-weight: bold;
    }
    .goal-container {
      position: relative;
      width: 100%;
      height: 120px;
      border: 4px solid #fff;
      border-bottom: none;
      background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%);
      margin-top: 10px;
      border-radius: 4px 4px 0 0;
    }
    .target-dot {
      position: absolute;
      width: 20px;
      height: 20px;
      background: #ff3b30;
      border: 2px solid #fff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px #ff3b30;
      transition: all 0.3s ease;
    }
    ul {
      margin: 8px 0 0 0;
      padding-left: 20px;
      color: #d1d1d6;
      font-size: 0.9rem;
    }
    li {
      margin-bottom: 6px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    button {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
    }
    button.auto-btn {
      background-color: transparent;
      border: 2px solid var(--accent-active);
      color: var(--accent-active);
      box-shadow: none;
    }
    button.auto-btn.active {
      background-color: var(--accent-active);
      color: #fff;
      box-shadow: 0 4px 12px rgba(52, 199, 89, 0.3);
    }
    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Shot Randomizer</h1>
    </header>

    <div class="card">
      <div class="metric">
        <div class="metric-icon">🦶</div>
        <div>
          <div class="metric-label">FOOT</div>
          <div class="metric-value" id="foot-val">--</div>
        </div>
      </div>

      <div class="metric">
        <div class="metric-icon">⚽</div>
        <div>
          <div class="metric-label">SHOT TYPE</div>
          <div class="metric-value" id="type-val">--</div>
        </div>
      </div>

      <div class="metric">
        <div class="metric-icon">🎯</div>
        <div>
          <div class="metric-label">TARGET LOCATION</div>
          <div class="metric-value" id="target-val">--</div>
        </div>
      </div>

      <div class="goal-container" id="goal">
        <div class="target-dot" id="target-dot" style="top: 50%; left: 50%; display: none;"></div>
      </div>
    </div>

    <div class="card">
      <div class="metric-label" style="margin-bottom: 8px;">KEY COACHING POINTS</div>
      <ul id="points-list">
        <li>Tap "NEW SHOT" to start your training session.</li>
      </ul>
    </div>

    <div class="btn-group">
      <button onclick="handleManualShot()">NEW SHOT</button>
      <button id="auto-btn" class="auto-btn" onclick="toggleAutoMode()">START 1-MIN TIMER</button>
    </div>
  </div>

  <script>
    const feet = ["Left Foot", "Right Foot"];
    
    const targets = [
      { name: "Top Left Corner", top: "15%", left: "10%" },
      { name: "Top Right Corner", top: "15%", left: "90%" },
      { name: "Bottom Left Corner", top: "85%", left: "10%" },
      { name: "Bottom Right Corner", top: "85%", left: "90%" },
      { name: "Center Goal", top: "50%", left: "50%" }
    ];

    const shotTypes = [
      {
        name: "Instep Drive",
        subtitle: "Laces Shot",
        points: ["Keep your ankle locked", "Strike using the top of the laces", "Follow through towards target", "Body over the ball"]
      },
      {
        name: "Placed Shot",
        subtitle: "Inside Foot",
        points: ["Open up your hips", "Strike with the inside arch", "Wrap foot around for side spin", "Focus on accuracy over power"]
      },
      {
        name: "Chip Shot",
        subtitle: "Lofted",
        points: ["Jab beneath the ball", "Lean slightly backward", "Shorten your follow-through"]
      },
      {
        name: "Trivela",
        subtitle: "Outside Foot",
        points: ["Approach target at an angle", "Strike with pinky-toe edge", "Slice across the ball for outward curve"]
      }
    ];

    let timerId = null;
    let isAutoMode = false;

    function speakInstructions(foot, type, target) {
      window.speechSynthesis.cancel();
      const phrase = `${foot}. ${type}. Aim for ${target}.`;
      
      const utterance = new SpeechSynthesisUtterance(phrase);
      utterance.rate = 0.9;
      utterance.pitch = 1.0;
      utterance.lang = 'en-US';

      window.speechSynthesis.speak(utterance);
    }

    function generateShot() {
      const selectedFoot = feet[Math.floor(Math.random() * feet.length)];
      const selectedTarget = targets[Math.floor(Math.random() * targets.length)];
      const selectedType = shotTypes[Math.floor(Math.random() * shotTypes.length)];

      document.getElementById("foot-val").innerText = selectedFoot;
      document.getElementById("target-val").innerText = selectedTarget.name;
      document.getElementById("type-val").innerText = `${selectedType.name} (${selectedType.subtitle})`;

      const dot = document.getElementById("target-dot");
      dot.style.display = "block";
      dot.style.top = selectedTarget.top;
      dot.style.left = selectedTarget.left;

      const list = document.getElementById("points-list");
      list.innerHTML = "";
      selectedType.points.forEach(point => {
        const li = document.createElement("li");
        li.innerText = point;
        list.appendChild(li);
      });

      speakInstructions(selectedFoot, selectedType.name, selectedTarget.name);
    }

    function resetInterval() {
      if (isAutoMode) {
        clearInterval(timerId);
        timerId = setInterval(generateShot, 60000); // 60,000 ms = 1 minute
      }
    }

    function handleManualShot() {
      generateShot();
      resetInterval(); // Resets the 1-minute countdown if tapped early
    }

    function toggleAutoMode() {
      const btn = document.getElementById("auto-btn");
      isAutoMode = !isAutoMode;

      if (isAutoMode) {
        btn.innerText = "STOP AUTO TIMER";
        btn.classList.add("active");
        generateShot();
        timerId = setInterval(generateShot, 60000);
      } else {
        btn.innerText = "START 1-MIN TIMER";
        btn.classList.remove("active");
        clearInterval(timerId);
        window.speechSynthesis.cancel();
      }
    }
  </script>
</body>
</html>
